# Describe your mesh for unifi-overhaul-client. Copy this file to
#   ~/.config/unifi-overhaul/mesh.ini
# (outside the repo, since it holds your own addresses) and edit it.
#
# One [section] per device; the section name is just a label. Give each AP the device it
# should connect through as its parent. The device with no parent is the wired gateway.
# Roles follow from the tree: an AP with children is a relay, one without is a leaf.

[mesh]
# 2.4 GHz channel for the whole backhaul chain (one radio carries a relay's uplink and downlink)
channel = 1

[gateway]
host = 192.0.2.1
user = root

[ap-hall]
host   = 192.0.2.20
user   = device-ssh-user
parent = gateway

[ap-far]
# host can be an alias from ~/.ssh/config; leave user out to let ssh config pick it
host   = ap-far
parent = ap-hall
